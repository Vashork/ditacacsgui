# =============================================================================
# TacacsGUI - Angie (Nginx-compatible) HTTPS vhost
#
# The certificate paths below are self-signed files created by the installer's
# SSL step (before this vhost is activated).
# The server_name (tacacsgui.local) is a placeholder the installer replaces.
# =============================================================================

server {
    listen 443 ssl http2;
    server_name tacacsgui.local;

    ssl_certificate /opt/tgui_data/ssl/tacacsgui.local.cer;
    ssl_certificate_key /opt/tgui_data/ssl/tacacsgui.local.key;

    # Reasonable TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/tacacsgui/web;
    index index.php index.html;

    # Front controller: serve existing files, otherwise route to Slim 4
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP 8.2 via PHP-FPM (dedicated tgui pool socket — see tgui-fpm-pool.conf)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-tgui.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    # Hide dotfiles (e.g. .htaccess, .git)
    location ~ /\. {
        deny all;
    }
}
