# =============================================================================
# TacacsGUI - Angie (Nginx-compatible) vhost
#
# This replaces the old Apache virtualhost configuration.
# The server_name below (tacacsgui.local) is a placeholder that the
# installer will replace (via sed) with the actual hostname at install time.
# =============================================================================

server {
    listen 80;
    server_name tacacsgui.local;

    root /opt/tacacsgui/web;
    index index.php index.html;

    # Front controller: serve existing files, otherwise route to Slim 4
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP 8.2 via PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    # Hide dotfiles (e.g. .htaccess, .git)
    location ~ /\. {
        deny all;
    }
}
