# =============================================================================
# TacacsGUI - Angie (Nginx-compatible) vhost
#
# This replaces the old Apache virtualhost configuration.
# The server_name below (tacacsgui.local) is a placeholder that the
# installer will replace (via sed) with the actual hostname at install time.
# =============================================================================

server {
    # default_server: this vhost is THE app; it must take :80 even when the
    # request Host header does not match server_name (e.g. curl by IP on the
    # local VM, or before the operator adds a /etc/hosts entry). The stock
    # Angie `default.conf` is disabled by the installer (see web_angie).
    listen 80 default_server;
    server_name tacacsgui.local;

    root /opt/tacacsgui/web;
    index index.php index.html;

    # Front controller: serve existing files, otherwise route to Slim 4
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP 8.2 via PHP-FPM. Points at the DEDICATED tgui pool socket (see
    # tgui-fpm-pool.conf). Do NOT use the stock php8.2-fpm.sock (owned by the
    # distro "www" pool).
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-tgui.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    # Hide dotfiles (e.g. .htaccess, .git)
    location ~ /\. {
        deny all;
    }
}
