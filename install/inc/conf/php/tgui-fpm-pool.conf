; TacacsGUI PHP-FPM pool. Drop into /etc/php/8.2/fpm/pool.d/tgui.conf.
[tgui]
user = www-data
group = www-data
listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 60s
security.limit_extensions = .php
env[TAC_ROOT_PATH] = /opt/tacacsgui
catch_workers_output = yes
