; TacacsGUI PHP-FPM pool. Drop into /etc/php/8.2/fpm/pool.d/tgui.conf.
; NOTE: this pool listens on a DEDICATED socket (php8.2-tgui.sock), not the
; stock php8.2-fpm.sock (owned by the distro "www" pool; two pools cannot
; share one socket). The Angie vhost fastcgi_pass must point at this same
; dedicated socket. The socket group is set to "angie" (the user Angie's
; workers run as) so the web server can connect; see listen.group below.
[tgui]
user = www-data
group = www-data
listen = /run/php/php8.2-tgui.sock
listen.owner = www-data
listen.group = angie
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 60s
security.limit_extensions = .php
env[TAC_ROOT_PATH] = /opt/tacacsgui
catch_workers_output = yes
