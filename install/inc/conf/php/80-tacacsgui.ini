; TacacsGUI app-specific PHP overrides, layered on top of the distro php.ini.
; Drop into /etc/php/8.2/fpm/conf.d/80-tacacsgui.ini.
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /var/log/tacacsgui/php-fpm-errors.log
